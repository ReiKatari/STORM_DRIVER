            <option name="tu_lrz_preserve_across_cmdbuf" value="true" />
            <option name="tu_drop_tile_wfi" value="true" />
            <option name="tu_autotune_bypass_margin" value="true" />
            
            <!-- 7. Proven Engine Baseline (tu_tile_discard=true for Diablo II & Streets of Rage 4) -->
            <option name="tu_tile_discard" value="true" />
            <option name="tu_indirect_ubo_bounds" value="true" />
            <option name="tu_gmem_pinning_zelda" value="true" />
