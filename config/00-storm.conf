            <option name="tu_shader_spirv_mem_fastpath" value="true" />
            
            <!-- 4. Global Depth & Precision Extensions (Safe 0.0.29 Baseline for Diablo II & 3D Games) -->
            <option name="tu_depth_bias_control_all_adreno" value="true" />
            <option name="tu_depth_range_unrestricted_a7xx_a8xx" value="true" />
            <option name="tu_dynamic_state_depth_bias_clamp" value="true" />
            <option name="tu_depth_bounds" value="true" />
            <option name="tu_depth_bounds_test" value="true" />
            <option name="tu_depth_clamp_control_fix" value="true" />
            <option name="tu_force_d32_unnormalized" value="true" />
            
