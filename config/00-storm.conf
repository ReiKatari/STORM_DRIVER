            <option name="mali_early_depth_bounds" value="true" />
            <option name="mali_forward_pixel_kill" value="true" />
            <option name="mali_tile_buffer_coherency" value="true" />
            <option name="mali_afbc_lossless" value="true" />
        </application>
        
        <!-- ==================== DEDICATED PROFILES ==================== -->
        <!-- 1. The Legend of Zelda: Breath of the Wild -->
        <application name="The Legend of Zelda: Breath of the Wild" application_name_match=".*(01007EF00011E000|01007EF00011E800|Zelda|Breath of the Wild).*">
