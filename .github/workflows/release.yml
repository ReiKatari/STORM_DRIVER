name: Release STORM DRIVER

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Package
        run: |
          python3 scripts/package_driver.py --src config --out STORM_DRIVER_${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: STORM_DRIVER_${{ github.ref_name }}.zip
          generate_release_notes: true